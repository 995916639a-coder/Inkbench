name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build for pull request
        if: github.event_name == 'pull_request'
        run: npm run build
      - name: Install Linux packaging tools
        if: github.event_name == 'push'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends fakeroot
      - name: Package Linux installer
        if: github.event_name == 'push'
        run: npm run package:linux -- --x64 --publish never
      - name: Upload Linux installer
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: inkbench-linux-amd64
          path: release/inkbench_*_amd64.deb
          if-no-files-found: error
          compression-level: 0
