name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build for pull request
        if: github.event_name == 'pull_request'
        run: npm run build
      - name: Install Linux packaging tools
        if: github.event_name == 'push'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends fakeroot
      - name: Package Linux installer
        id: package
        if: github.event_name == 'push'
        run: |
          npm run package:linux -- --x64 --publish never
          version="$(node -p 'require("./package.json").version')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Upload Linux installer
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: inkbench-linux-amd64
          path: release/inkbench_*_amd64.deb
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-v${{ needs.build.outputs.version }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Check for an existing release
        id: check
        run: |
          releases="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[] | [.tag_name, .draft] | @tsv')"
          if grep -Fxq -- "v$VERSION"$'\tfalse' <<< "$releases"; then
            echo "Release v$VERSION already exists."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif grep -Fxq -- "v$VERSION"$'\ttrue' <<< "$releases"; then
            echo "::error::A draft for v$VERSION already exists. Review it in GitHub Releases."
            exit 1
          fi
      - uses: actions/checkout@v7
        if: steps.check.outputs.exists != 'true'
      - uses: actions/download-artifact@v8
        if: steps.check.outputs.exists != 'true'
        with:
          name: inkbench-linux-amd64
          path: release
      - name: Publish installer and version notes
        if: steps.check.outputs.exists != 'true'
        run: |
          tag="v$VERSION"
          asset="release/inkbench_${VERSION}_amd64.deb"
          test "$(dpkg-deb -f "$asset" Version)" = "$VERSION"
          test "$(dpkg-deb -f "$asset" Architecture)" = amd64

          refs="$(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}")"
          tag_args=(--target "$GITHUB_SHA")
          if [[ -n "$refs" ]]; then
            target="$(awk -v ref="refs/tags/$tag" '$2 == ref { sha = $1 } $2 == ref "^{}" { peeled = $1 } END { print (peeled ? peeled : sha) }' <<< "$refs")"
            if [[ "$target" != "$GITHUB_SHA" ]]; then
              echo "::error::Tag $tag already points to a different commit."
              exit 1
            fi
            tag_args+=(--verify-tag)
          fi

          notes="$RUNNER_TEMP/inkbench-release-notes.md"
          awk -v version="$VERSION" '$1 == "###" { if (found) exit; if ($2 == version) found = 1; next } found' update.md > "$notes"
          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "::error::Missing release notes for $tag in update.md."
            exit 1
          fi
          gh release create "$tag" "$asset" "${tag_args[@]}" --title "Inkbench $tag" --notes-file "$notes"
